backend:
  name: git-gateway
  branch: main # или master, если ваша главная ветка называется так

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "issues"
    label: "Выпуски журнала"
    folder: "src/content/issues"
    create: true
    slug: "issue-{{year}}-{{month}}"
    fields:
      - {label: "Номер и название", name: "title", widget: "string"}
      - {label: "Обложка", name: "cover", widget: "image", required: false}
      - {label: "Статус выпуска", name: "status", widget: "select", options: ["Текущий", "Архив"]}
      - {label: "Дата публикации", name: "date", widget: "datetime"}
      - {label: "Текст выпуска", name: "body", widget: "markdown"}
